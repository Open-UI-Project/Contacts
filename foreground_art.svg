<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 1080" width="1080" height="1080">
  <defs>
    <!-- Soft shadow for the dark red circle -->
    <filter id="circle-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#4A0000" flood-opacity="0.45" />
    </filter>
    
    <!-- Subtle inner shadow for recessed feel in the dark circle -->
    <radialGradient id="darkCircleGrad" cx="50%" cy="42%" r="52%">
      <stop offset="0%" stop-color="#B71C1C" />
      <stop offset="85%" stop-color="#961010" />
      <stop offset="100%" stop-color="#7F0808" />
    </radialGradient>
    
    <!-- Soft shadow for the white contact silhouette -->
    <filter id="white-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#000000" flood-opacity="0.3" />
    </filter>
    
    <!-- Subtle 3D gradient for white silhouette -->
    <linearGradient id="whiteGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#EDEDED" />
    </linearGradient>
  </defs>

  <!-- Foreground only: Dark circle with shadow + White person -->
  <!-- Dark Red Center Circle (diameter 480, radius 240) -->
  <circle cx="540" cy="540" r="240" fill="url(#darkCircleGrad)" filter="url(#circle-shadow)" />
  
  <!-- Subtle inner rim highlight -->
  <circle cx="540" cy="540" r="238" fill="none" stroke="#D32F2F" stroke-width="3" stroke-opacity="0.4" />

  <!-- Person Head (radius 68, center 540, 455) -->
  <circle cx="540" cy="455" r="68" fill="url(#whiteGrad)" filter="url(#white-shadow)" />
  
  <!-- Person Body/Bust (rounded dome) -->
  <path d="M 385 645 C 385 550, 435 540, 540 540 C 645 540, 695 550, 695 645 C 695 662, 680 670, 660 670 L 420 670 C 400 670, 385 662, 385 645 Z" 
        fill="url(#whiteGrad)" filter="url(#white-shadow)" />
</svg>